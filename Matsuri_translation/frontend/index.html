<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>烤推机 · TweetToaster</title>
  <link rel="icon" type="image/png" href="img/brand-logo.png">
  <link rel="stylesheet" href="index.css">
  <script defer src="FileSaver.min.js"></script>
  <script defer src="api3.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="preview-pane" aria-label="图片预览">
      <div class="preview-toolbar">
        <div>
          <strong>图片预览</strong>
          <span id="preview-hint">输入推文链接后开始</span>
        </div>
        <button class="ghost-button mobile-settings" id="show-settings" type="button">编辑</button>
      </div>
      <div class="preview-scroll">
        <div id="capture" class="capture" aria-live="polite">
          <div class="empty-preview" id="empty-preview">
            <div class="skeleton profile-skeleton"></div>
            <div class="skeleton line line-wide"></div>
            <div class="skeleton line line-medium"></div>
            <div class="skeleton media-skeleton"></div>
            <div class="skeleton line line-short"></div>
            <p>一张可以直接发布的烤推图，会出现在这里。</p>
          </div>
        </div>
      </div>
    </section>

    <aside class="settings-pane" id="settings-pane">
      <div class="settings-scroll">
        <header class="brand">
          <img class="brand-mark" src="img/brand-logo.png" alt="夏色祭工坊">
          <div>
            <h1>烤推机</h1>
            <p>TweetToaster · 重新开炉</p>
          </div>
          <button class="ghost-button close-settings" id="hide-settings" type="button" aria-label="关闭编辑面板">完成</button>
        </header>

        <form id="tweet-form" class="query-form">
          <label for="tweet-url">X 主页、@用户名或推文链接</label>
          <div class="query-row">
            <input id="tweet-url" name="url" type="text" inputmode="url"
              placeholder="suisei_hosimati 或 x.com/user/status/123…" autocomplete="off" required>
            <button class="primary-button" id="query-button" type="submit">查询</button>
          </div>
          <p class="field-help">支持用户名、@用户名和主页/单推链接，不用手打 https://</p>
        </form>

        <div id="status" class="status" hidden role="status"></div>

        <section class="panel" id="translation-panel" hidden>
          <div class="panel-heading">
            <div>
              <h2>翻译与选段</h2>
              <p>每段翻译会紧跟在对应推文下方。</p>
            </div>
            <span class="count-badge" id="tweet-count"></span>
          </div>
          <div class="selection-actions" aria-label="批量选择">
            <button class="mini-button" id="recommended-selection" type="button">仅目标</button>
            <button class="mini-button" id="select-all" type="button">全选</button>
            <button class="mini-button" id="select-none" type="button">清空</button>
          </div>
          <div id="translation-list" class="translation-list"></div>
        </section>

        <section class="panel" id="style-panel" hidden>
          <div class="panel-heading">
            <div>
              <h2>落款与模板</h2>
              <p>这里选择的是翻译图片落款，与烤推机自己的品牌 Logo 无关。</p>
            </div>
          </div>
          <div class="field-grid">
            <label>
              Logo
              <select id="logo-select">
                <option value="official">夏色祭工坊</option>
                <option value="keke">工坊 · Keke</option>
                <option value="magic">Magic</option>
                <option value="none">不显示</option>
                <option value="custom">上传自定义 Logo…</option>
              </select>
            </label>
            <label>
              翻译字号
              <select id="font-size-select">
                <option value="26">标准</option>
                <option value="23">紧凑</option>
                <option value="30">醒目</option>
              </select>
            </label>
          </div>
          <input id="custom-logo" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <label class="check-row">
            <input id="show-counts" type="checkbox" checked>
            <span>显示回复、转发和点赞数</span>
          </label>
          <details class="template-details">
            <summary>高级：自定义翻译 HTML 模板</summary>
            <p>用 <code>{T}</code> 代表翻译文字。危险标签、脚本和事件属性会被自动移除。</p>
            <textarea id="template-input" rows="7" spellcheck="false"
              placeholder="<div class=&quot;my-template&quot;>{T}</div>"></textarea>
          </details>
        </section>

        <div class="action-bar" id="action-bar" hidden>
          <button class="primary-button download-button" id="download-button" type="button">下载 PNG</button>
          <button class="secondary-button" id="reset-button" type="button">重新开始</button>
        </div>

        <footer>
          数据仅用于生成图片；PNG 缓存会自动清理。由免费的公开推文数据源驱动。
        </footer>
      </div>
    </aside>
  </main>
</body>
</html>
